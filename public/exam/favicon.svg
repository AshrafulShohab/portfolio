<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C97B"/>
      <stop offset="100%" stop-color="#A97E34"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181A20"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
  </defs>
  <!-- Background Shield / Rounded Badge -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#C5A059" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Owl Knowledge Crest -->
  <g transform="translate(14, 13) scale(1.5)" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Contour & Ears -->
    <path d="M4 4c1 2 2.5 3 4 3 1.5 0 2.5-1 4-1s2.5 1 4 1c1.5 0 3-1 4-3v6c0 6-3.5 11-8 12-4.5-1-8-6-8-12V4z" fill="#C5A059" fill-opacity="0.1"/>
    <!-- Left Eye -->
    <circle cx="9" cy="11" r="2.5" fill="#181A20" stroke="url(#goldGrad)"/>
    <circle cx="9" cy="11" r="0.8" fill="#E8C97B"/>
    <!-- Right Eye -->
    <circle cx="15" cy="11" r="2.5" fill="#181A20" stroke="url(#goldGrad)"/>
    <circle cx="15" cy="11" r="0.8" fill="#E8C97B"/>
    <!-- Beak -->
    <path d="M12 12.5v2.5" stroke="url(#goldGrad)"/>
    <path d="M11 13.5l1 1.5 1-1.5" stroke="url(#goldGrad)"/>
    <!-- Breast feather -->
    <path d="M10 18c1 .8 3 .8 4 0" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>
</svg>

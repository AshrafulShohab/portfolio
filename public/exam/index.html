    <!-- Dynamic absolute URL resolution for social previews -->
    <script>
      try {
        if (typeof window !== 'undefined' && window.location && window.location.origin) {
          var origin = window.location.origin;
          var ogImg = document.querySelector('meta[property="og:image"]');
          if (ogImg && !ogImg.getAttribute('content').startsWith('http')) {
            ogImg.setAttribute('content', origin + '/og-image.png');
          }
          var twImg = document.querySelector('meta[name="twitter:image"]');
          if (twImg && !twImg.getAttribute('content').startsWith('http')) {
            twImg.setAttribute('content', origin + '/og-image.png');
          }
        }
      } catch (e) {}
    </script>

      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {

        });

  <body>
    <div id="root"></div>
   <script>
      // Aggressive hack to replace the Navbar SVG icon without rebuilding
      const observer = new MutationObserver(() => {
        const svgs = document.querySelectorAll('svg');
        for (let svg of svgs) {
          
          // Traverse up to 3 levels to find the container holding the text
          let parent = svg.parentElement;
          let isLogo = false;
          
          for (let i = 0; i < 3; i++) {
            if (parent && parent.textContent.includes('Exam Portal')) {
              isLogo = true;
              break;
            }
            if (parent) parent = parent.parentElement;
          }

          // If we found it, swap it!
          if (isLogo) {
            const img = document.createElement('img');
            img.src = '/exam/logo.png'; 
            
            // Inherit the exact classes of the old SVG so it fits perfectly
            img.className = svg.getAttribute('class') || '';
            img.style.height = '100%';
            img.style.width = '100%';
            img.style.minHeight = '28px';
            img.style.objectFit = 'contain';
            
            svg.replaceWith(img);
            observer.disconnect(); // Stop looking
            return;
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    </script>
  </body>
